services:
  # ---------- Products (MySQL) ----------
  mysql:
    image: mysql:8.3.0
    environment:
      MYSQL_ROOT_PASSWORD: 1111
    ports:
      - "3307:3306" # 3306 on the host is taken by local MySQL
    volumes:
      - ./eCommerceSolution.ProductsService/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-network
    hostname: mysql-host-productsmicroservice

  products-microservice:
    image: khalidalhadi/ecommerce-products-microservice:v1.0
    build:
      context: ./eCommerceSolution.ProductsService
      dockerfile: ProductsMicroService.API/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      MYSQL_HOST: mysql-host-productsmicroservice
      MYSQL_PASSWORD: 1111
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network
    depends_on:
      - mysql

  # ---------- Users (Postgres) ----------
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: ecommerceusers
    ports:
      - "5433:5432" # 5432 on the host is taken by local Postgres
    volumes:
      - ./eCommerceSolution.UsersService/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-network
    hostname: postgres-host-usersmicroservice

  users-microservice:
    image: khalidalhadi/ecommerce-user-microservice:v1.0
    build:
      context: ./eCommerceSolution.UsersService
      dockerfile: eCommerce.API/Dockerfile
    environment:
      NG_HOST: postgres-host-usersmicroservice
      NG_PASSWORD: 1111
    ports:
      - "9090:9090"
    networks:
      - ecommerce-network
    depends_on:
      - postgres

  # ---------- Orders (MongoDB) ----------
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - ./eCommerceSolution.OrderService/mongodb-init:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-network
    hostname: mongodb-host-ordersmicroservice

  orders-microservice:
    image: khalidalhadi/ecommerce-orders-microservice:v1.0
    build:
      context: ./eCommerceSolution.OrderService
      dockerfile: OrdersMicroservice.API/Dockerfile
    environment:
      MONGODB_HOST: mongodb-host-ordersmicroservice
      MONGODB_PORT: 27017
    ports:
      - "7000:8080" # 8080 on the host is used by the Products service
    networks:
      - ecommerce-network
    depends_on:
      - mongodb

networks:
  ecommerce-network:
    driver: bridge
